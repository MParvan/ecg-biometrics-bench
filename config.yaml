project:
  data_root: "./datasets"
  seed: 42

datasets:
  ecgid:
    root_dir: "ecgid"
    zip_name: "ECGID_Dataset.zip"
    url: "https://physionet.org/content/ecgiddb/get-zip/1.0.0/"
    sample_length: 20000
    fs: 500
    signal_type: "filtered"        # Options: "raw", "filtered"
    preprocessing:
      mode: "beat"
      pre_s: 0.2
      post_s: 0.4
      resample_len: null
      window_s: 5.0
      stride_s: 1.0
      rpeak_method: "pantompkins"
      align_peak: true
      # Half-width of the search that re-centres each beat on its R-peak.
      # null derives it from the median R-R interval, which is recommended:
      # several detectors report the peak of a smoothed detection curve rather
      # than the fiducial point, lagging it by up to ~70 ms, and a search
      # narrower than that lag can settle on a neighbouring wave.
      align_window_s: null
      filter_method: "butter"
      filter_parameters:
        low: 0.5
        high: 40.0
        order: 4
      normalization_method: "zscore"

  ptb:
