project:
  data_root: "./datasets"
  seed: 42

datasets:
  ecgid:
    root_dir: "ecgid"
    zip_name: "ECGID_Dataset.zip"
    url: "https://physionet.org/content/ecgiddb/get-zip/1.0.0/"
    # Declared so that a recording contradicting it stops the run. The rate
    # stored in each WFDB header is what preprocessing uses.
    fs: 500
    # Which of the two stored channels to read. Options: "raw", "filtered".
    # ECG-ID ships a hardware-filtered copy alongside the raw recording, but the
    # filter that produced it is not documented. Reading the raw channel keeps
    # ECG-ID on the same preprocessing path as the other datasets, which supply
    # raw signals only. Overridden by --signal_type.
    signal_type: "raw"
    preprocessing:
      mode: "beat"
      pre_s: 0.2
      post_s: 0.4
      resample_len: null
      window_s: 5.0
      stride_s: 1.0
      rpeak_method: "pantompkins"
      align_peak: true
      # Half-width of the search that refines each detection to the true
      # R-peak, in seconds. Several detectors report the peak of a smoothed
      # detection curve rather than the fiducial point, lagging it by up to
      # ~70 ms, and a search narrower than that lag can settle on a
      # neighbouring wave. Independent of pre_s and post_s: the search runs on
      # the recording, not inside the beat that is cut afterwards.
      align_window_s: 0.10
      filter_method: "butter"
      filter_parameters:
        low: 0.5
        high: 40.0
        order: 4
      normalization_method: "zscore"

  ptb:
    root_dir: "ptb"
    zip_name: "ptb_Dataset.zip"
    url: "https://physionet.org/content/ptbdb/get-zip/1.0.0/"
    # Declared so that a recording contradicting it stops the run. The rate
    # stored in each WFDB header is what preprocessing uses. Record duration
    # varies from 32 to 120 seconds, so there is no single sample length.
    fs: 1000
    preprocessing:
      mode: "beat"
      pre_s: 0.2
      post_s: 0.4
      resample_len: null
      window_s: 5.0
      stride_s: 1.0
      rpeak_method: "pantompkins"
      align_peak: true
      # Half-width of the search that refines each detection to the true
      # R-peak, in seconds. Several detectors report the peak of a smoothed
      # detection curve rather than the fiducial point, lagging it by up to
      # ~70 ms, and a search narrower than that lag can settle on a
      # neighbouring wave. Independent of pre_s and post_s: the search runs on
      # the recording, not inside the beat that is cut afterwards.
      align_window_s: 0.10
      filter_method: "butter"
      filter_parameters:
        low: 0.5
        high: 40.0
        order: 4
      normalization_method: "zscore"

  mitbih:
    root_dir: "mitbih"
    zip_name: "mitbih_Dataset.zip"
    url: "https://physionet.org/content/mitdb/get-zip/1.0.0/"
    # Declared so that a recording contradicting it stops the run. The rate
    # stored in each WFDB header is what preprocessing uses. Protocols select
    # minute ranges rather than a fixed sample count, so no length is declared.
    fs: 360
    preprocessing:
      mode: "beat"
      pre_s: 0.2
      post_s: 0.4
      resample_len: null
      window_s: 5.0
      stride_s: 1.0
      rpeak_method: "pantompkins"
      align_peak: true
      # Half-width of the search that refines each detection to the true
      # R-peak, in seconds. Several detectors report the peak of a smoothed
      # detection curve rather than the fiducial point, lagging it by up to
      # ~70 ms, and a search narrower than that lag can settle on a
      # neighbouring wave. Independent of pre_s and post_s: the search runs on
      # the recording, not inside the beat that is cut afterwards.
      align_window_s: 0.10
      filter_method: "butter"
      filter_parameters:
        low: 0.5
        high: 40.0
        order: 4
      normalization_method: "zscore"

  nsrdb:
    root_dir: "nsrdb"
    zip_name: "nsrdb_Dataset.zip"
    url: "https://physionet.org/content/nsrdb/get-zip/1.0.0/"
    # Declared so that a recording contradicting it stops the run. The rate
    # stored in each WFDB header is what preprocessing uses. Protocols select
    # minute ranges rather than a fixed sample count, so no length is declared.
    fs: 128
    preprocessing:
      mode: "beat"
      pre_s: 0.2
      post_s: 0.4
      resample_len: null
      window_s: 5.0
      stride_s: 1.0
      rpeak_method: "pantompkins"
      align_peak: true
      # Half-width of the search that refines each detection to the true
      # R-peak, in seconds. Several detectors report the peak of a smoothed
      # detection curve rather than the fiducial point, lagging it by up to
      # ~70 ms, and a search narrower than that lag can settle on a
      # neighbouring wave. Independent of pre_s and post_s: the search runs on
      # the recording, not inside the beat that is cut afterwards.
      align_window_s: 0.10
      filter_method: "butter"
      filter_parameters:
        low: 0.5
        high: 40.0
        order: 4
      normalization_method: "zscore"

  ptbxl:
    root_dir: "ptbxl"
    zip_name: "ptbxl_Dataset.zip"
    url: "https://physionet.org/content/ptb-xl/get-zip/1.0.3/"
    # No fs entry: PTB-XL ships every recording at both 100 Hz and 500 Hz, so
    # the rate follows from the --resolution setting rather than being a
    # separate choice. The loader checks each header against the rate its
    # resolution implies.
    preprocessing:
      mode: "beat"
      pre_s: 0.2
      post_s: 0.4
      resample_len: null
      window_s: 5.0
      stride_s: 1.0
      rpeak_method: "pantompkins"
      align_peak: true
      # Half-width of the search that refines each detection to the true
      # R-peak, in seconds. Several detectors report the peak of a smoothed
      # detection curve rather than the fiducial point, lagging it by up to
      # ~70 ms, and a search narrower than that lag can settle on a
      # neighbouring wave. Independent of pre_s and post_s: the search runs on
      # the recording, not inside the beat that is cut afterwards.
      align_window_s: 0.10
      filter_method: "butter"
      filter_parameters:
        low: 0.5
        high: 40.0
        order: 4
      normalization_method: "zscore"

  heartprint:
    root_dir: "heartprint"
    zip_name: "Heartprint_Dataset.zip"
    url: "https://figshare.com/ndownloader/articles/20105354/versions/3"
    # Each file holds 7,500 lines of which the first 3,747 are signal; the
    # remainder is written by the recording device and is excluded.
    sample_length: 3747
    fs: 250
    preprocessing:
      mode: "beat"
      pre_s: 0.2
      post_s: 0.4
      resample_len: null
      window_s: 5.0
      stride_s: 1.0
      rpeak_method: "pantompkins"
      align_peak: true
      # Half-width of the search that refines each detection to the true
      # R-peak, in seconds. Several detectors report the peak of a smoothed
      # detection curve rather than the fiducial point, lagging it by up to
      # ~70 ms, and a search narrower than that lag can settle on a
      # neighbouring wave. Independent of pre_s and post_s: the search runs on
      # the recording, not inside the beat that is cut afterwards.
      align_window_s: 0.10
      filter_method: "butter"
      filter_parameters:
        low: 0.5
        high: 40.0
        order: 4
      normalization_method: "zscore"

  cybhi:
    root_dir: "cybhi"
    zip_name: "cybhi_Dataset.zip"
    url: "https://zenodo.org/records/2381823/files/CYBHi.zip"
    fs: 1000
    # Short-term acquisitions were recorded simultaneously by two units:
    # "8B" from the hand palms with Ag/AgCl electrodes, "85" from the fingers
    # with electrolycra. The electrolycra recordings mostly defeat beat
    # detection, so the Ag/AgCl unit is the default; "both" pools the two for
    # an electrode comparison. Overridden by the electrode_unit argument.
    electrode_unit: "8B"
    # Column holding the ECG in the seven-column short-term files; long-term
    # files have a single column and fall back to it.
    ecg_column: 3
    preprocessing:
      mode: "beat"
      pre_s: 0.2
      post_s: 0.4
      resample_len: null
      window_s: 5.0
      stride_s: 1.0
      rpeak_method: "pantompkins"
      align_peak: true
      # Half-width of the search that refines each detection to the true
      # R-peak, in seconds. Several detectors report the peak of a smoothed
      # detection curve rather than the fiducial point, lagging it by up to
      # ~70 ms, and a search narrower than that lag can settle on a
      # neighbouring wave. Independent of pre_s and post_s: the search runs on
      # the recording, not inside the beat that is cut afterwards.
      align_window_s: 0.10
      filter_method: "butter"
      filter_parameters:
        low: 0.5
        high: 40.0
        order: 4
      normalization_method: "zscore"

training_defaults:
  batch_size: 64
  epochs: 30
  lr: 1e-3
  val_split: 0.0
  crossvalidation: false
  n_folds: 5