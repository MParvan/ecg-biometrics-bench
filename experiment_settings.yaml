# ==========================================
# EXPERIMENT CONFIGURATION TEMPLATE
# ==========================================

# --- Training Hyperparameters ---
epochs: 35
batch_size: 64
lr: 0.001
test_split: 0.2
val_split: 0.1
seed: 42

# --- Evaluation & Biometric Settings ---
use_template: true
template_fusion_method: "representative"
template_size: null  # Leave as null (or ~) to use all available beats
matching_method: "cosine"
num_pairs: 10000

# --- Signal Quality & Filtering ---
outlier_filtering_on_train: true
outlier_filtering_on_test: false
sqi_method: "kurtosis"
sqi_threshold: 0.05
sqi_keep_pct: 0.80

# --- Logging & Misc ---
save_results: true
visualize: false
device: "auto"